id: 'trpcultivate_genetic'
label: 'Chado Fields for Genetic Content Types'
description: 'Fields focused on covering the columns of the Chado tables associated with the Genetic content types.'
fields:

## Genetic Map ##

    -   name: 'genetic_map_type'
        content_type: 'genetic_map'
        label: 'Type'
        type: 'chado_additional_type_type_default'
        description: 'An additional type for the item, typically used for adding more specific types from external vocabularies in microdata syntax. This is a relationship between something and a class that the thing is in.'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                type_table: 'featuremapprop'
                type_column: 'type_id'
        settings:
            termIdSpace: 'data'
            termAccession: '1278'
            fixed_value: 'data:1278'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_identifier'
        content_type: 'genetic_map'
        label: 'Identifier'
        type: 'chado_property_type_default'
        description: 'This should follow the format YEAR-AUTHOR-POPULATION where the author should be the initials. For example, a map generated in 2019 by TA Haile on LR-01 would have an identifier of 2019-TAH-LR-01.'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                prop_table: 'featuremapprop'
            max_length: 255
        settings:
            termIdSpace: 'data'
            termAccession: '0842'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_name'
        content_type: 'genetic_map'
        label: 'Name'
        type: 'chado_string_type_default'
        description: 'The name of the genetic map. This should follow the format "POPULATION (MATERNAL PARENT x PATERNAL PARENT); AUTHOR et al., YEAR" where the author should be the last name followed by the first initial. For example, a map generated in 2019 by TA Haile on LR-01 would have a name of "LR-01 (ILL 1704 x CDC Robin); Haile TA et al., 2019".'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                base_column: 'name'
            max_length: 255
        settings:
            termIdSpace: 'schema'
            termAccession: 'name'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: -28
          form:
            default:
              region: 'content'
              weight: -28

    -   name: 'genetic_map_population_name'
        content_type: 'genetic_map'
        label: 'Population Name'
        type: 'chado_property_type_default'
        description: 'The name of the population used to generate the map. This should match exactly with the name of the population used when submitting the map for publication.'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                prop_table: 'featuremapprop'
            max_length: 255
        settings:
            termIdSpace: 'NCIT'
            termAccession: 'C207467'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: -27
          form:
            default:
              region: 'content'
              weight: -27

    -   name: 'genetic_map_year_published'
        content_type: 'genetic_map'
        label: 'Year Published'
        type: 'chado_property_type_default'
        description: 'The year this genetic map was published or made available.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                prop_table: 'featuremapprop'
            max_length: 4
        settings:
            termIdSpace: 'TPUB'
            termAccession: '0000059'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: -26
          form:
            default:
              region: 'content'
              weight: -26

    -   name: 'genetic_map_population_type'
        content_type: 'genetic_map'
        label: 'Population Type'
        type: 'chado_property_type_default'
        description: 'The type of population used to generate the map (e.g. F2, BC1, RIL, ABC).'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                prop_table: 'featuremapprop'
            max_length: 255
        settings:
            termIdSpace: 'local'
            termAccession: 'Population Type'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_population_size'
        content_type: 'genetic_map'
        label: 'Population Size'
        type: 'chado_property_type_default'
        description: 'The number of individuals in the population used to generate the map.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                prop_table: 'featuremapprop'
            max_length: 255
        settings:
            termIdSpace: 'local'
            termAccession: 'Population Size'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_unit_type'
        content_type: 'genetic_map'
        label: 'Unit Type'
        type: 'chado_unit_type_default'
        description: 'The unit of measurement used for the distance between the relative (e.g. cM) or physical (e.g. bp) positions of the genetic markers in the map.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                type_table: 'featuremap'
                type_column: 'unittype_id'
        settings:
            termIdSpace: 'UO'
            termAccession: '0000000'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_author'
        content_type: 'genetic_map'
        label: 'Primary Author'
        type: 'chado_contact_by_role_type_default'
        description: 'The primary researcher who is responsible for this map. In cases where multiple researchers were involved, you want to choose the one who would be the first author on a paper describing this map.'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                linker_table: 'featuremap_contact'
                linker_fkey_column: 'contact_id'
        settings:
            termIdSpace: 'NCIT'
            termAccession: 'C47954'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_organism'
        content_type: 'genetic_map'
        label: 'Organism'
        type: 'chado_organism_type_default'
        description: 'The scientific name of the population used in generating the map.'
        cardinality: -1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'featuremap'
                linker_table: 'featuremap_organism'
                linker_fkey_column: 'organism_id'
        settings:
