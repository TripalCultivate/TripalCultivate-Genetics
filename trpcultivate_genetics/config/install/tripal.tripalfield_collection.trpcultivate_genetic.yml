              region: 'content'
              label: 'above'
          form:
            default:
              region: 'content'

    -   name: 'genetic_map_dataset'
        content_type: 'genetic_map'
        label: 'Dataset'
        type: 'chado_property_type_default'
        description: 'Use this field to describe specific datasets that are part of this genetic map.'
        cardinality: -1
