id: 'trpcultivate_genetic_chado'
label: 'Tripal Cultivate: Chado Fields for Genetic Content Types'
description: 'Fields focused on covering the columns of the Chado tables associated with the Genetic content types.'
fields:

## Genetic Map ##

    -   name: genetic_map_type
        content_type: genetic_map
        label: Type
        type: chado_additional_type_type_default
        description: An additional type for the item, typically used for adding more specific types from external vocabularies in microdata syntax. This is a relationship between something and a class that the thing is in.
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: featuremap
                type_table: featuremapprop
                type_column: type_id
        settings:
            termIdSpace: "data"
            termAccession: "1278"
            fixed_value: "data:1278"
        display:
          view:
            default:
              region: content
              label: above
              weight: 10
          form:
            default:
              region: content
              weight: 10

    -   name: genetic_map_identifier
        content_type: genetic_map
        label: Identifier
        type: chado_string_type_default
        description: This should follow the format YEAR-AUTHOR-POPULATION where the author should be the initials. For example, a map generated in 2019 by TA Haile on LR-01 would have an identifier of 2019-TAH-LR-01.
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: featuremap
                base_column: identifier
            max_length: 255
        settings:
            termIdSpace: data
            termAccession: '0842'
        display:
          view:
            default:
              region: content
              label: above
              weight: 10
          form:
            default:
              region: content
              weight: 10

    -   name: genetic_map_name
        content_type: genetic_map
        label: Name
        type: chado_string_type_default
        description: The name of the item.
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: featuremap
                base_column: name
            max_length: 255
        settings:
            termIdSpace: schema
            termAccession: name
        display:
          view:
            default:
              region: content
              label: above
              weight: 10
          form:
            default:
              region: content
              weight: 10

    -   name: genetic_map_population_name
        content_type: genetic_map
        label: Population Name
        type: chado_string_type_default
        description: The name of the population used to generate the map. This should match the name of the population in the population if there is a discrepancy between that value and KnowPulse.
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: featuremap
                base_column: population_name
            max_length: 255
        settings:
            termIdSpace: local
            termAccession: population_name
        display:
          view:
            default:
              region: content
              label: above
              weight: 10
          form:
            default:
              region: content
              weight: 10

