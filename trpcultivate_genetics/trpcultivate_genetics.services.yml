services:
  Drupal\tripal\Services\TripalLogger:
    alias: 'tripal.logger'

  trpcultivate_genetics.hooks:
    class: 'Drupal\trpcultivate_genetics\Hook\TripalCultivateGeneticsHooks'
    arguments:
      - '@tripal.logger'

  trpcultivate_genetics.setup_module_service:
    class: 'Drupal\trpcultivate_genetics\Service\SetupModuleService'
    arguments: [
      '@entity_type.manager',
      '@tripal_chado.database',
      '@tripal_chado.custom_tables',
      '@tripal_chado.terms_init',
      '@tripal.tripalentitytype_collection',
      '@tripal.tripalfield_collection',
    ]
